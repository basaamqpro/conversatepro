<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Conversate Pro - Conversations</title>

  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      min-height: 100%;
    }


    body {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #111827;
      background: #f8fafc;
    }


    h1,
    h2,
    h3,
    p {
      overflow-wrap: anywhere;
    }


    button,
    input,
    select {
      font: inherit;
    }


    /*
    ==================================================
    PANEL
    ==================================================
    */

    .panel {
      margin-bottom: 18px;
      padding: 20px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      background: #ffffff;
    }


    /*
    ==================================================
    HEADER
    ==================================================
    */

    .header,
    .room_header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }


    .header h1,
    .room_header h3 {
      margin: 0 0 6px;
    }


    .header p,
    .room_header p {
      margin: 0;
    }


    .brand_text {
      color: #2563eb;
    }


    /*
    ==================================================
    CREATE ROOM GRID
    ==================================================
    */

    .grid {
      display: grid;
      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );
      gap: 16px;
    }


    label {
      display: block;
      margin: 10px 0 6px;
      font-weight: bold;
    }


    input,
    select,
    button {
      width: 100%;
      padding: 11px;
      border-radius: 9px;
      font-size: 16px;
    }


    input,
    select {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      outline: none;
    }


    input:focus,
    select:focus {
      border-color: #2563eb;
      outline: 2px solid rgba(
        37,
        99,
        235,
        0.12
      );
    }


    button {
      border: 0;
      cursor: pointer;
      background: #111827;
      color: #ffffff;
    }


    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }


    button.secondary {
      background: #e5e7eb;
      color: #111827;
    }


    button.danger {
      background: #b91c1c;
    }


    button.primary {
      background: #2563eb;
      color: #ffffff;
    }


    /*
    ==================================================
    BUTTON ROWS
    ==================================================
    */

    .button_row,
    .room_actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }


    .button_row {
      margin-top: 15px;
    }


    .button_row button,
    .room_actions button,
    .header button {
      width: auto;
      min-width: 110px;
    }


    /*
    ==================================================
    TEXT
    ==================================================
    */

    .muted {
      color: #64748b;
    }


    .section_description {
      margin-top: -5px;
      color: #64748b;
      line-height: 1.5;
    }


    /*
    ==================================================
    STATUS MESSAGE
    ==================================================
    */

    .message {
      display: none;
      margin: 12px 0 18px;
      padding: 12px;
      border-radius: 9px;
      font-weight: bold;
    }


    .message.visible {
      display: block;
    }


    .message.error {
      background: #fee2e2;
      color: #991b1b;
    }


    .message.success {
      background: #dcfce7;
      color: #166534;
    }


    .message.loading {
      background: #dbeafe;
      color: #1d4ed8;
    }


    /*
    ==================================================
    ROOM CARD
    ==================================================
    */

    .room_card {
      margin-top: 14px;
      padding: 16px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: #ffffff;
    }


    .room_languages {
      font-weight: 700;
    }


    .room_count {
      margin-top: 5px !important;
      font-size: 14px;
    }


    /*
    ==================================================
    EMPTY ROOMS
    ==================================================
    */

    .empty {
      padding: 20px;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      background: #ffffff;
      color: #64748b;
      text-align: center;
    }


    /*
    ==================================================
    MOBILE
    ==================================================
    */

    @media (
      max-width: 700px
    ) {

      body {
        padding: 12px;
      }


      .grid {
        grid-template-columns:
          1fr;
      }


      .header,
      .room_header {
        align-items: flex-start;
        flex-direction: column;
      }


      .header button {
        width: 100%;
      }


      .room_actions {
        width: 100%;
      }


      .room_actions button {
        width: 100%;
      }


      .button_row button {
        width: 100%;
      }

    }

  </style>
</head>


<body>


  <!--
  ==================================================
  APP STATUS
  ==================================================
  -->

  <div
    id="appMessage"
    class="message"
    role="status"
    aria-live="polite"
  ></div>



  <!--
  ==================================================
  USER HEADER
  ==================================================
  -->

  <section class="panel">

    <div class="header">

      <div>

        <h1>
          Conversate
          <span class="brand_text">
            Pro
          </span>
        </h1>

        <p>
          Welcome,
          <strong
            id="loggedInUsername"
          ></strong>
        </p>

        <p class="muted">
          Choose a conversation or
          create a new one.
        </p>

      </div>


      <button
        id="logoutButton"
        type="button"
        class="secondary"
      >
        Logout
      </button>

    </div>

  </section>



  <!--
  ==================================================
  CREATE CONVERSATION ROOM
  ==================================================
  -->

  <section class="panel">

    <h2>
      Create Conversation
    </h2>

    <p class="section_description">
      Choose the language you understand
      and the language you want to practise.
    </p>


    <div class="grid">


      <!-- ROOM NAME -->

      <div>

        <label for="newRoomName">
          Conversation name
        </label>

        <input
          id="newRoomName"
          type="text"
          placeholder="Arabic conversation"
        >

      </div>



      <!-- SOURCE LANGUAGE -->

      <div>

        <label
          for="newRoomSourceLanguage"
        >
          Your language
        </label>

        <select
          id="newRoomSourceLanguage"
        ></select>

      </div>



      <!-- TARGET LANGUAGE -->

      <div>

        <label
          for="newRoomTargetLanguage"
        >
          Practice language
        </label>

        <select
          id="newRoomTargetLanguage"
        ></select>

      </div>


    </div>



    <div class="button_row">

      <button
        id="createRoomButton"
        type="button"
        class="primary"
      >
        Create Conversation
      </button>

    </div>

  </section>



  <!--
  ==================================================
  EXISTING ROOMS
  ==================================================
  -->

  <section>

    <h2>
      Your Conversations
    </h2>

    <div
      id="show_rooms_names"
    ></div>

  </section>



  <!--
  ==================================================
  RESULTS5.JS

  We use the exact same language list
  as the existing LingoGPT translation
  system.

  Later index.html will also use
  results5.js for the exact same:
  - translation
  - pronunciation
  - source flow
  - target flow
  - sentence breakdown
  ==================================================
  -->

  <script
    src="results5.js"
  ></script>



  <script type="module">

    /*
    ==================================================
    FIREBASE
    ==================================================
    */

    import "./firebase.js";


    "use strict";



    /*
    ==================================================
    STATE
    ==================================================
    */

    let currentUser =
      null;


    let rooms =
      [];



    /*
    ==================================================
    MESSAGE
    ==================================================
    */

    function showMessage(
      message,
      type
    ) {

      const box =
        document.getElementById(
          "appMessage"
        );


      box.textContent =
        message || "";


      box.className =
        "message";


      if (
        !message
      ) {

        return;

      }


      box.classList.add(
        "visible"
      );


      if (
        type === "error"
      ) {

        box.classList.add(
          "error"
        );

      }


      else if (
        type === "success"
      ) {

        box.classList.add(
          "success"
        );

      }


      else {

        box.classList.add(
          "loading"
        );

      }

    }



    /*
    ==================================================
    FALLBACK LANGUAGES
    ==================================================

    Normally results5.js provides
    the supported-language list.

    This fallback means welcome.html
    can still create rooms if results5.js
    fails to load for some reason.
    ==================================================
    */

    const fallbackLanguages = [

      "English",
      "Arabic",
      "Hausa",
      "French",
      "Spanish",
      "Portuguese",
      "German",
      "Italian",
      "Dutch",
      "Russian",
      "Ukrainian",
      "Polish",
      "Turkish",
      "Persian",
      "Urdu",
      "Hindi",
      "Bengali",
      "Punjabi",
      "Gujarati",
      "Marathi",
      "Tamil",
      "Telugu",
      "Kannada",
      "Malayalam",
      "Nepali",
      "Sinhala",
      "Mandarin Chinese",
      "Cantonese",
      "Japanese",
      "Korean",
      "Vietnamese",
      "Thai",
      "Indonesian",
      "Malay",
      "Filipino (Tagalog)",
      "Swahili",
      "Somali",
      "Amharic",
      "Yoruba",
      "Igbo",
      "Zulu",
      "Afrikaans",
      "Hebrew",
      "Greek",
      "Romanian",
      "Czech",
      "Hungarian",
      "Swedish",
      "Norwegian",
      "Danish"

    ];



    /*
    ==================================================
    SUPPORTED LANGUAGES
    ==================================================
    */

    const supportedLanguages =

      window.LingoGPTResults &&

      Array.isArray(
        window
          .LingoGPTResults
          .supportedLanguages
      )

        ? window
            .LingoGPTResults
            .supportedLanguages

        : fallbackLanguages;



    /*
    ==================================================
    POPULATE SELECT
    ==================================================
    */

    function populateSelect(
      selectId,
      selectedLanguage
    ) {

      const select =
        document.getElementById(
          selectId
        );


      select.innerHTML =
        "";


      supportedLanguages.forEach(

        function(language) {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            language;


          option.textContent =
            language;


          option.selected =
            language ===
            selectedLanguage;


          select.appendChild(
            option
          );

        }

      );

    }



    /*
    ==================================================
    POPULATE DEFAULT LANGUAGES
    ==================================================
    */

    function populateLanguages() {

      populateSelect(
        "newRoomSourceLanguage",
        "English"
      );


      populateSelect(
        "newRoomTargetLanguage",
        "Arabic"
      );

    }



    /*
    ==================================================
    RENDER ROOMS
    ==================================================
    */

    function renderRooms() {

      const container =
        document.getElementById(
          "show_rooms_names"
        );


      container.innerHTML =
        "";


      /*
      No rooms yet.
      */

      if (
        !rooms.length
      ) {

        const empty =
          document.createElement(
            "div"
          );


        empty.className =
          "empty";


        empty.textContent =
          "You have no conversations yet. Create your first conversation above.";


        container.appendChild(
          empty
        );


        return;

      }



      /*
      Show every room.
      */

      rooms.forEach(

        function(room) {


          /*
          ------------------------------
          ROOM CARD
          ------------------------------
          */

          const card =
            document.createElement(
              "article"
            );


          card.className =
            "room_card";



          /*
          ------------------------------
          HEADER
          ------------------------------
          */

          const header =
            document.createElement(
              "div"
            );


          header.className =
            "room_header";



          /*
          ------------------------------
          ROOM DETAILS
          ------------------------------
          */

          const details =
            document.createElement(
              "div"
            );



          const title =
            document.createElement(
              "h3"
            );


          title.textContent =
            room.room_name ||
            "Untitled Conversation";



          /*
          Languages
          */

          const languages =
            document.createElement(
              "p"
            );


          languages.className =
            "muted room_languages";


          languages.textContent =

            (
              room.source_language ||
              "Source"
            )

            +

            " → "

            +

            (
              room.target_language ||
              "Target"
            );



          /*
          Message count
          */

          const messageCount =

            Array.isArray(
              room.room_data
            )

              ? room
                  .room_data
                  .length

              : 0;



          const count =
            document.createElement(
              "p"
            );


          count.className =
            "muted room_count";


          count.textContent =

            messageCount

            +

            (
              messageCount === 1
                ? " conversation message"
                : " conversation messages"
            );



          details.append(

            title,
            languages,
            count

          );



          /*
          ------------------------------
          ACTIONS
          ------------------------------
          */

          const actions =
            document.createElement(
              "div"
            );


          actions.className =
            "room_actions";



          /*
          OPEN BUTTON
          */

          const openButton =
            document.createElement(
              "button"
            );


          openButton.type =
            "button";


          openButton.className =
            "primary";


          openButton.textContent =
            "Open Conversation";


          openButton.onclick =
            function() {

              openRoom(
                room.room_idx
              );

            };



          /*
          DELETE BUTTON
          */

          const deleteButton =
            document.createElement(
              "button"
            );


          deleteButton.type =
            "button";


          deleteButton.className =
            "danger";


          deleteButton.textContent =
            "Delete";


          deleteButton.onclick =
            function() {

              removeRoom(
                room
              );

            };



          actions.append(

            openButton,
            deleteButton

          );



          header.append(

            details,
            actions

          );



          card.appendChild(
            header
          );


          container.appendChild(
            card
          );

        }

      );

    }



    /*
    ==================================================
    LOAD ROOMS
    ==================================================
    */

    async function loadRooms() {

      rooms =

        await window
          .ConversateFirebase
          .getRooms();


      renderRooms();

    }



    /*
    ==================================================
    CREATE ROOM
    ==================================================
    */

    async function createRoom() {

      const roomName =

        document
          .getElementById(
            "newRoomName"
          )
          .value
          .trim();



      const sourceLanguage =

        document
          .getElementById(
            "newRoomSourceLanguage"
          )
          .value;



      const targetLanguage =

        document
          .getElementById(
            "newRoomTargetLanguage"
          )
          .value;



      const button =
        document.getElementById(
          "createRoomButton"
        );



      /*
      ------------------------------
      Validate room name
      ------------------------------
      */

      if (
        !roomName
      ) {

        showMessage(
          "Enter a conversation name.",
          "error"
        );


        return;

      }



      /*
      ------------------------------
      Languages must differ
      ------------------------------
      */

      if (
        sourceLanguage ===
        targetLanguage
      ) {

        showMessage(
          "Choose different languages.",
          "error"
        );


        return;

      }



      button.disabled =
        true;


      button.textContent =
        "Creating...";



      showMessage(
        "Creating conversation..."
      );



      try {


        /*
        firebase.js saves this inside:

        conversate_Data
          ↓
        user
          ↓
        rooms[]
        */

        await window
          .ConversateFirebase
          .createRoom(

            roomName,

            sourceLanguage,

            targetLanguage

          );



        /*
        Clear room name input.
        */

        document.getElementById(
          "newRoomName"
        ).value =
          "";



        /*
        Reload rooms from Firebase.
        */

        await loadRooms();



        showMessage(
          "Conversation created.",
          "success"
        );


      } catch (error) {


        console.error(
          error
        );


        showMessage(

          error.message ||

          "Could not create conversation.",

          "error"

        );


      } finally {


        button.disabled =
          false;


        button.textContent =
          "Create Conversation";

      }

    }



    /*
    ==================================================
    OPEN ROOM
    ==================================================

    firebase.js saves:

    conversate_current_room

    The future Conversate Pro index.html
    will read this value through:

    ConversateFirebase.getCurrentRoom()
    ==================================================
    */

    function openRoom(
      roomIdx
    ) {


      window
        .ConversateFirebase
        .selectRoom(
          roomIdx
        );


      window.location.href =
        "index.html";

    }



    /*
    ==================================================
    DELETE ROOM
    ==================================================
    */

    async function removeRoom(
      room
    ) {


      const confirmed =
        confirm(

          'Delete "' +

          (
            room.room_name ||
            "this conversation"
          )

          +

          '" and all of its conversation messages?'

        );



      if (
        !confirmed
      ) {

        return;

      }



      showMessage(
        "Deleting conversation..."
      );



      try {


        await window
          .ConversateFirebase
          .deleteRoom(
            room.room_idx
          );



        /*
        firebase.js also clears any
        temporary Options/Teach data
        for this room.
        */

        await loadRooms();



        showMessage(
          "Conversation deleted.",
          "success"
        );


      } catch (error) {


        console.error(
          error
        );


        showMessage(

          error.message ||

          "Could not delete conversation.",

          "error"

        );

      }

    }



    /*
    ==================================================
    LOGOUT
    ==================================================
    */

    function logout() {

      window
        .ConversateFirebase
        .logout();

    }



    /*
    ==================================================
    START PAGE
    ==================================================
    */

    async function startPage() {


      /*
      First prepare language selectors.
      */

      populateLanguages();



      showMessage(
        "Loading your conversations..."
      );



      try {


        /*
        ==================================================
        SYNC

        Same account
              ↓
        account_Details

        Conversate data
              ↓
        conversate_Data

        Local browser cache
              ↓
        conversate_user_data
        ==================================================
        */

        const synced =

          await window
            .ConversateFirebase
            .sync();



        /*
        No logged-in user.
        */

        if (
          !synced ||
          !synced.user
        ) {


          window.location.replace(
            "loginregister.html"
          );


          return;

        }



        currentUser =
          synced.user;



        /*
        Display username.
        */

        document.getElementById(
          "loggedInUsername"
        ).textContent =

          currentUser.username ||

          currentUser.name ||

          "User";



        /*
        Load Conversate Pro rooms.
        */

        rooms =

          Array.isArray(
            synced.data?.rooms
          )

            ? synced.data.rooms

            : [];



        renderRooms();


        showMessage("");


      } catch (error) {


        console.error(
          error
        );


        showMessage(

          error.message ||

          "Could not load your conversations.",

          "error"

        );

      }

    }



    /*
    ==================================================
    EVENTS
    ==================================================
    */

    document
      .getElementById(
        "createRoomButton"
      )
      .addEventListener(

        "click",

        createRoom

      );



    document
      .getElementById(
        "logoutButton"
      )
      .addEventListener(

        "click",

        logout

      );



    /*
    Press Enter while entering
    conversation name.
    */

    document
      .getElementById(
        "newRoomName"
      )
      .addEventListener(

        "keydown",

        function(event) {


          if (
            event.key ===
            "Enter"
          ) {


            event.preventDefault();


            createRoom();

          }

        }

      );



    /*
    ==================================================
    START
    ==================================================
    */

    startPage();


  </script>

</body>
</html>
